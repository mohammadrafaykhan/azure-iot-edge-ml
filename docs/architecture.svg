<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
      .edge { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .cloud { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .ops { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .text { font-size: 12.5px; fill: #334155; }
      .small { font-size: 11.5px; fill: #475569; }
      .zone-label { font-size: 13px; font-weight: 600; fill: #475569; }
      .flow { font-size: 11.5px; fill: #1e293b; }
      .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1240" height="860" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">Edge ML on Azure IoT Edge 1.6</text>
  <text x="30" y="60" class="text">Raw readings stay on the device; alerts and one-minute summaries go to the cloud. Models are trained in the image build and rolled out by digest.</text>

  <!-- Edge zone -->
  <rect x="20" y="80" width="680" height="560" rx="12" class="zone"/>
  <text x="36" y="104" class="zone-label">Edge device: Azure VM · Ubuntu 24.04 · IoT Edge 1.6 · Moby · no inbound ports</text>

  <rect x="40" y="124" width="190" height="112" rx="8" class="edge"/>
  <text x="56" y="148" class="title">press-sensor</text>
  <text x="56" y="170" class="text">press-01..03 at 1 Hz</text>
  <text x="56" y="188" class="text">vibration, temperature,</text>
  <text x="56" y="204" class="text">current, speed</text>
  <text x="56" y="224" class="small">faults set in its module twin</text>

  <rect x="272" y="124" width="210" height="112" rx="8" class="edge"/>
  <text x="288" y="148" class="title">anomaly-detector</text>
  <text x="288" y="170" class="text">10 s windows → 8 features</text>
  <text x="288" y="188" class="text">ONNX Runtime · model vN</text>
  <text x="288" y="206" class="text">debounce 3 / 6 windows</text>
  <text x="288" y="224" class="small">model card + stats in module twin</text>

  <rect x="522" y="124" width="160" height="112" rx="8" class="edge"/>
  <text x="538" y="148" class="title">edgeHub</text>
  <text x="538" y="170" class="text">store and forward</text>
  <text x="538" y="188" class="text">alerts: priority 0, 24 h</text>
  <text x="538" y="206" class="text">summaries: 5, 2 h</text>
  <text x="538" y="224" class="small">queue on /srv/edgeHub</text>

  <line x1="230" y1="180" x2="268" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="482" y1="180" x2="518" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="249" cy="164" r="9" fill="#2563eb"/><text x="245.5" y="168" class="num">1</text>
  <circle cx="500" cy="164" r="9" fill="#2563eb"/><text x="496.5" y="168" class="num">2</text>

  <rect x="40" y="270" width="300" height="104" rx="8" class="box"/>
  <text x="56" y="294" class="title">edgeAgent</text>
  <text x="56" y="316" class="text">runs the deployment manifest</text>
  <text x="56" y="334" class="text">pulls images by digest</text>
  <text x="56" y="354" class="small">with the edge-pull token (7-day password)</text>

  <rect x="372" y="270" width="310" height="104" rx="8" class="box"/>
  <text x="388" y="294" class="title">IoT identity service</text>
  <text x="388" y="316" class="text">X.509 key generated on the device</text>
  <text x="388" y="334" class="text">thumbprint pinned in IoT Hub</text>
  <text x="388" y="354" class="small">modules get tokens from the workload API</text>

  <rect x="40" y="408" width="642" height="112" rx="8" class="box"/>
  <text x="56" y="432" class="title">Image build (build-images.sh through Azure Run Command)</text>
  <text x="56" y="456" class="text">context archive from Blob (managed identity) → docker build: stage 1 trains the model (scikit-learn),</text>
  <text x="56" y="474" class="text">stage 2 ships ONNX Runtime + model.onnx + model.json → push to the registry (managed identity, AcrPush)</text>
  <text x="56" y="498" class="small">prints the pushed digests; the manifest pins them</text>

  <rect x="40" y="548" width="642" height="74" rx="8" class="box"/>
  <text x="56" y="572" class="title">Outage simulation (network.sh)</text>
  <text x="56" y="594" class="text">iptables rejects TCP to the hub in OUTPUT and DOCKER-USER; detection continues, edgeHub queues,</text>
  <text x="56" y="611" class="text">and after reconnection alerts are delivered before summaries</text>

  <!-- Azure zone -->
  <rect x="740" y="80" width="480" height="560" rx="12" class="zone"/>
  <text x="756" y="104" class="zone-label">Azure (Central India) · Entra ID everywhere</text>

  <rect x="760" y="124" width="440" height="112" rx="8" class="cloud"/>
  <text x="776" y="148" class="title">IoT Hub (F1, shared access policies off)</text>
  <text x="776" y="170" class="text">route: $connectionModuleId = 'anomaly-detector' → storage</text>
  <text x="776" y="188" class="text">deployments (applyConfigurationContent), module twins</text>
  <text x="776" y="208" class="small">fallback to the built-in endpoint</text>
  <text x="776" y="224" class="small">identity-based storage endpoint (system managed identity)</text>

  <rect x="760" y="270" width="440" height="104" rx="8" class="cloud"/>
  <text x="776" y="294" class="title">Storage (shared keys off)</text>
  <text x="776" y="316" class="text">edge-insights: alerts and summaries as JSON, 1-minute batches</text>
  <text x="776" y="334" class="text">build: build-context archives</text>
  <text x="776" y="354" class="small">roles scoped to a single container</text>

  <rect x="760" y="408" width="440" height="112" rx="8" class="cloud"/>
  <text x="776" y="432" class="title">Container Registry (Basic, admin user off)</text>
  <text x="776" y="456" class="text">edge-ml/press-sensor, edge-ml/anomaly-detector</text>
  <text x="776" y="474" class="text">tags: source hash (+ model version)</text>
  <text x="776" y="498" class="small">scope map edge-pull: content/read + metadata/read only</text>

  <!-- edgeHub -> IoT Hub -->
  <path d="M682,160 L756,160" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <circle cx="719" cy="146" r="9" fill="#059669"/><text x="715.5" y="150" class="num">3</text>
  <!-- IoT Hub -> Storage -->
  <path d="M980,236 L980,266" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <circle cx="996" cy="251" r="9" fill="#059669"/><text x="992.5" y="255" class="num">4</text>
  <!-- Storage build -> image build -->
  <path d="M760,340 L716,340 L716,440 L686,440" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <!-- image build -> ACR -->
  <path d="M682,480 L756,480" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <circle cx="719" cy="494" r="9" fill="#334155"/><text x="715.5" y="498" class="num">5</text>
  <!-- ACR -> edgeAgent (pull) -->
  <path d="M1170,520 L1170,631 L30,631 L30,322 L36,322" stroke="#334155" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <circle cx="300" cy="631" r="9" fill="#334155"/><text x="296.5" y="635" class="num">6</text>

  <!-- Operator zone -->
  <rect x="20" y="670" width="1200" height="170" rx="12" class="zone"/>
  <text x="36" y="694" class="zone-label">Operator laptop · signed in with Entra ID (az login)</text>

  <rect x="40" y="712" width="560" height="110" rx="8" class="ops"/>
  <text x="56" y="736" class="title">deploy.ps1 · rollout.ps1 · network.ps1</text>
  <text x="56" y="758" class="text">Bicep, then Azure Run Command on the VM (governed by Azure RBAC):</text>
  <text x="56" y="776" class="text">first-boot wait + thumbprint, provisioning, image build, outage switch</text>
  <text x="56" y="800" class="small">new 7-day pull password per deployment, passed by environment, never printed</text>

  <rect x="640" y="712" width="560" height="110" rx="8" class="ops"/>
  <text x="656" y="736" class="title">edgectl (IoT Hub REST + Blob, Entra ID)</text>
  <text x="656" y="758" class="text">device register · deploy (manifest pinned by digest) · status</text>
  <text x="656" y="776" class="text">fault · tune (module twins) · alerts · summaries (with delivery delay)</text>
  <text x="656" y="800" class="small">a redeploy keeps operator settings such as active faults</text>

  <!-- operator arrows -->
  <path d="M440,712 L440,644" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="456" cy="676" r="9" fill="#7c3aed"/><text x="452.5" y="680" class="num">7</text>
  <path d="M920,712 L920,644" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="936" cy="676" r="9" fill="#7c3aed"/><text x="932.5" y="680" class="num">8</text>

  <!-- legend -->
  <text x="760" y="548" class="flow">1 readings on a local route · 2 alerts and summaries</text>
  <text x="760" y="566" class="flow">3 upstream as the X.509 device · 4 routing (hub identity)</text>
  <text x="760" y="584" class="flow">5 build and push (VM identity) · 6 pull by digest (token)</text>
  <text x="760" y="602" class="flow">7 Run Command · 8 deployments, twins, routed events</text>
</svg>
